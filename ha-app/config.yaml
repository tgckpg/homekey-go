name: Home Key Go
version: "0.0.6"
slug: homekey_go
description: HomeKit virtual lock with Apple Home Key NFC authentication
url: https://sgit.k8s.astropenguin.net/penguin/homekey-go/
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
host_network: true
host_dbus: true
backup: cold
stage: experimental
image: ghcr.io/tgckpg/homekey-go
ingress: true
ingress_port: 8099
panel_title: Home Key locks
options:
  interface: ""
  locks:
    - id: GO-HOMEKEY-001
      name: Go Home Key
      port: 51826
      finish: silver
      readers: []
  readers: []
schema:
  interface: str
  locks:
    - id: str(1,64)
      name: str(1,)
      port: port
      finish: list(silver|black|gold|tan)
      readers:
        - str
  readers:
    - id: str(1,64)
      address: str
      adapter: str
