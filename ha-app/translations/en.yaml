configuration:
  name:
    name: Accessory name
    description: Name shown in Apple Home.
  serial:
    name: Serial number
    description: Stable accessory serial. Keep unchanged once paired.
  port:
    name: HomeKit port
    description: TCP listen port on the HA OS host. Must be unused by other services.
  interface:
    name: LAN interface
    description: Host network interface for mDNS. Leave empty for automatic selection.
  finish:
    name: Wallet artwork
    description: Home Key appearance in Apple Wallet.
  pin:
    name: Pairing PIN
    description: Leave empty to generate and save a PIN. Otherwise use eight digits.
  ble_reader:
    name: BLE reader address
    description: ESP32 MAC from its serial log. Leave empty to disable the PING probe.
  ble_adapter:
    name: Bluetooth adapter
    description: Local BlueZ adapter, usually hci0.
